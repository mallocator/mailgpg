name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict --quiet --reporter github-actions-logging

      - name: Install GPG
        run: brew install gnupg pinentry

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MailGPG.xcodeproj \
            -scheme MailGPG \
            -destination 'platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
